trigger:
  branches:
    include:
      - main
      - release/*

resources:
  repositories:
    - repository: templates
      type: github
      name: myorg/pipeline-templates
      ref: refs/tags/v2.0.0
    - repository: tools
      type: github
      name: myorg/build-tools
      ref: refs/heads/stable

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
          - checkout: templates
          - template: stages/build.yml@templates

  - stage: Test
    jobs:
      - job: TestJob
        steps:
          - checkout: self
          - template: stages/test.yml@templates
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/test-results.xml'
