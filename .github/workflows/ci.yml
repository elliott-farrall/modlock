name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run tests
        run: pytest -v

  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Lock example workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          modlock lock \
            --lockfile modules/github-actions/examples/modlock.lock \
            modules/github-actions/examples/workflow-simple.yml \
            modules/github-actions/examples/workflow-complex.yml
      - name: Show lock file
        run: cat modules/github-actions/examples/modlock.lock
      - name: Apply locks to examples
        run: |
          modlock apply \
            --lockfile modules/github-actions/examples/modlock.lock \
            modules/github-actions/examples/workflow-simple.yml \
            modules/github-actions/examples/workflow-complex.yml
      - name: Show locked output
        run: |
          echo "--- workflow-simple.yml ---"
          cat modules/github-actions/examples/workflow-simple.yml
          echo "--- workflow-complex.yml ---"
          cat modules/github-actions/examples/workflow-complex.yml
