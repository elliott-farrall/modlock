name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v

  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Lock example files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: modlock lock
      - name: Show lock file
        run: cat modlock.lock
      - name: Apply locks
        run: modlock apply
      - name: Show locked output
        run: |
          for f in modules/*/examples/*.yml; do
            echo "--- $f ---"
            cat "$f"
          done
