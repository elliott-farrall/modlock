name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m pytest -v

  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lock example workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python modlock.py lock \
            --lockfile examples/modlock.lock \
            examples/workflow-simple.yml \
            examples/workflow-complex.yml
      - name: Show lock file
        run: cat examples/modlock.lock
      - name: Apply locks to examples
        run: |
          python modlock.py apply \
            --lockfile examples/modlock.lock \
            examples/workflow-simple.yml \
            examples/workflow-complex.yml
      - name: Show locked output
        run: |
          echo "--- workflow-simple.yml ---"
          cat examples/workflow-simple.yml
          echo "--- workflow-complex.yml ---"
          cat examples/workflow-complex.yml
